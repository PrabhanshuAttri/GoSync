name: gosync

x-portals:
  - host: 0.0.0.0
    name: Web UI
    path: /
    port: ${GOSYNC_WEB_PORT:-49152}
    scheme: http

services:
  gosync:
    image: ghcr.io/prabhanshuattri/gosync:${GOSYNC_IMAGE_TAG:-latest}
    container_name: gosync
    labels:
      org.opencontainers.image.title: GoSync
      org.opencontainers.image.description: GoPro Cloud library download tool
      org.opencontainers.image.source: https://github.com/prabhanshuattri/GoSync
      org.opencontainers.image.url: https://github.com/prabhanshuattri/GoSync
      org.opencontainers.image.vendor: prabhanshuattri
      org.opencontainers.image.version: ${GOSYNC_VERSION:-latest}
    environment:
      ENV: ${ENV:-production}
      DATA_DIR: /data
      HAR_FILE: ${HAR_FILE:-gopro.com.har}
      DOWNLOAD_FOLDER: ${DOWNLOAD_FOLDER:-downloads}
      GOSYNC_STATE_FILE: ${GOSYNC_STATE_FILE:-gosync_state.json}
      AUTH_METHOD: ${AUTH_METHOD:-har}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      USER_ID: ${USER_ID:-}
      DOWNLOAD_TELEMETRY: ${DOWNLOAD_TELEMETRY:-false}
      CREATE_XMP_SIDECARS: ${CREATE_XMP_SIDECARS:-true}
      BATCH_MAX_BYTES: ${BATCH_MAX_BYTES:-auto}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}
      FFMPEG_BINARY: ${FFMPEG_BINARY:-ffmpeg}
      FFMPEG_TIMEOUT_SECONDS: ${FFMPEG_TIMEOUT_SECONDS:-900}
      EXIFTOOL_BINARY: ${EXIFTOOL_BINARY:-exiftool}
      EXIFTOOL_TIMEOUT_SECONDS: ${EXIFTOOL_TIMEOUT_SECONDS:-300}
      FFPROBE_BINARY: ${FFPROBE_BINARY:-ffprobe}
      FFPROBE_TIMEOUT_SECONDS: ${FFPROBE_TIMEOUT_SECONDS:-30}
      PER_CHAPTER_OVERHEAD_BYTES: ${PER_CHAPTER_OVERHEAD_BYTES:-10485760}
      MIN_TOLERANCE_BYTES: ${MIN_TOLERANCE_BYTES:-4194304}
      MAX_TOLERANCE_BYTES: ${MAX_TOLERANCE_BYTES:-209715200}
      MAX_LOCAL_MERGES_PER_RUN: ${MAX_LOCAL_MERGES_PER_RUN:-10}
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080
      GOSYNC_WEB_PORT: ${GOSYNC_WEB_PORT:-49152}
      ACCESS_LOGS: ${ACCESS_LOGS:-true}
      MAX_HAR_UPLOAD_BYTES: ${MAX_HAR_UPLOAD_BYTES:-104857600}
    ports:
      - ${GOSYNC_WEB_PORT:-49152}:8080
    volumes:
      - ${GOSYNC_VOLUME_PATH:-./data}:/data
    restart: "no"
