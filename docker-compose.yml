name: gosync

x-portals:
  - host: 0.0.0.0
    name: Web UI
    path: /
    port: ${GOSYNC_WEB_PORT:-49152}
    scheme: http

services:
  gosync:
    image: ghcr.io/prabhanshuattri/gosync:${GOSYNC_IMAGE_TAG:-1.0.3}
    container_name: gosync
    labels:
      org.opencontainers.image.title: GoSync
      org.opencontainers.image.description: GoPro cloud library recovery and downloader
      org.opencontainers.image.source: https://github.com/prabhanshuattri/GoSync
      org.opencontainers.image.url: https://github.com/prabhanshuattri/GoSync
      org.opencontainers.image.vendor: prabhanshuattri
      org.opencontainers.image.version: ${GOSYNC_VERSION:-1.0.3}
    environment:
      ENV: ${ENV:-production}
      DATA_DIR: /data
      HAR_FILE: ${HAR_FILE:-gopro.com.har}
      DOWNLOAD_FOLDER: ${DOWNLOAD_FOLDER:-downloads}
      COMPLETED_LOG: ${COMPLETED_LOG:-completed_ids.txt}
      BATCH_SIZE: ${BATCH_SIZE:-5}
      MAX_RETRY_PASSES: ${MAX_RETRY_PASSES:-3}
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080
      ACCESS_LOGS: ${ACCESS_LOGS:-true}
    ports:
      - ${GOSYNC_WEB_PORT:-49152}:8080
    volumes:
      - ${GOSYNC_VOLUME_PATH:-./data}:/data
    restart: "no"
