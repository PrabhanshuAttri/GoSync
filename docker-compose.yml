services:
  gosync:
    image: ghcr.io/prabhanshuattri/gosync:latest
    container_name: gosync
    environment:
      DATA_DIR: /data
      HAR_FILE: ${HAR_FILE:-gopro.com.har}
      DOWNLOAD_FOLDER: ${DOWNLOAD_FOLDER:-downloads}
      COMPLETED_LOG: ${COMPLETED_LOG:-completed_ids.txt}
      BATCH_SIZE: ${BATCH_SIZE:-5}
      MAX_RETRY_PASSES: ${MAX_RETRY_PASSES:-3}
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080
      ACCESS_LOGS: ${ACCESS_LOGS:-false}
    ports:
      - ${GOSYNC_WEB_PORT:-49152}:8080
    volumes:
      - ${GOSYNC_VOLUME_PATH:-./data}:/data
    restart: "no"
